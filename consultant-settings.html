<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Instellingen | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="settings-page">
  <header class="site-header">
    <div class="brand" aria-label="Agenda">
      <span class="brand-mark" aria-hidden="true">&#128197;</span>
      <div class="brand-copy">
        <span id="consultant-name">Instellingen</span>
        <span class="brand-location" id="consultant-location" hidden></span>
      </div>
    </div>
    <div class="header-actions">
      <button class="secondary-button" id="back-button" type="button">Terug</button>
      <button class="logout-button" id="logout-button" type="button" aria-label="Uitloggen" title="Uitloggen">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="settings-shell">
    <section class="settings-panel" aria-labelledby="settings-title">
      <div class="settings-topbar">
        <div class="settings-heading">
          <p class="eyebrow">Accountgegevens</p>
          <h1 id="settings-title">Instellingen</h1>
        </div>
      </div>

      <form class="settings-form" id="settings-form">
        <section class="settings-section" aria-labelledby="contact-details-title">
          <h3 id="contact-details-title">Contactgegevens</h3>
          <div class="settings-stack">
            <div class="field-row field-row-name">
              <span class="field-label">Naam</span>
              <div class="field-inline-grid no-sub-labels">
                <input id="setting-first-name" name="voornaam" type="text" readonly>
                <input id="setting-prefix" name="tussenvoegsel" type="text" readonly>
                <input id="setting-last-name" name="achternaam" type="text" readonly>
              </div>
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-email">E-mailadres</label>
              <input id="setting-email" name="email" type="email" readonly>
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-phone">Telefoonnummer</label>
              <input id="setting-phone" name="telefoonnummer" type="text" readonly>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="work-location-title">
          <h3 id="work-location-title">Werklocatie</h3>
          <div class="settings-stack">
            <div class="field-row">
              <span class="field-label">Naam</span>
              <input id="setting-default-location" name="defaultlocatie" type="text" readonly>
            </div>

            <div class="field-row field-row-address">
              <span class="field-label">Adres</span>
              <div class="field-inline-grid no-sub-labels">
                <input id="setting-adres" name="adres" type="text" readonly>
                <input id="setting-postcode" name="postcode" type="text" readonly>
                <input id="setting-plaats" name="plaats" type="text" readonly>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="other-details-title">
          <h3 id="other-details-title">Overige gegevens</h3>
          <div class="settings-stack">
            <div class="field-row">
              <label class="field-label" for="setting-role">Rol</label>
              <input id="setting-role" name="role" type="text" readonly>
            </div>

            <div class="field-row">
              <span class="field-label">Werkdagen</span>
              <div class="weekday-list" role="group" aria-label="Werkdagen">
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Ma">
                  <span>Ma</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Di">
                  <span>Di</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Wo">
                  <span>Wo</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Do">
                  <span>Do</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Vr">
                  <span>Vr</span>
                </label>
              </div>
            </div>

            <div class="field-row field-row-hours">
              <span class="field-label">Werktijden</span>
              <div class="time-inline no-sub-labels">
                <input id="setting-start-werkdag" name="start_werkdag" type="text" readonly>
                <span class="time-separator">t/m</span>
                <input id="setting-einde-werkdag" name="einde_werkdag" type="text" readonly>
              </div>
            </div>

          </div>
        </section>

        <div class="settings-actions">
          <button class="secondary-button" id="cancel-button" type="button">Annuleren</button>
          <button class="primary-button" type="button" id="save-button">Opslaan</button>
        </div>
      </form>
      <section class="settings-form" aria-labelledby="password-reset-requests-title">
        <section class="settings-section" aria-labelledby="password-reset-requests-title">
          <h3 id="password-reset-requests-title">Wachtwoordaanvragen</h3>
          <p class="settings-status" id="password-reset-requests-empty">Er zijn geen open wachtwoordaanvragen.</p>
          <ul class="password-reset-list" id="password-reset-requests"></ul>
        </section>
      </section>
      <p id="settings-status" class="settings-status" role="status" hidden></p>
      <p id="settings-error" class="login-error" role="alert" hidden></p>
    </section>
  </main>

  <script>
    const settingsError = document.querySelector("#settings-error");

    async function loadPasswordResetRequests() {
      const list = document.querySelector("#password-reset-requests");
      const emptyMessage = document.querySelector("#password-reset-requests-empty");
      try {
        const response = await fetch("/api/consultant/password-reset-requests");
        const requests = await response.json();
        if (!response.ok) throw new Error(requests.error || "Wachtwoordaanvragen konden niet worden geladen.");

        list.replaceChildren();
        emptyMessage.hidden = requests.length > 0;
        for (const request of requests) {
          const item = document.createElement("li");
          const details = document.createElement("div");
          const title = document.createElement("strong");
          const contact = document.createElement("p");
          const date = document.createElement("p");
          const actions = document.createElement("div");
          const inProgressButton = document.createElement("button");
          const resolveButton = document.createElement("button");

          title.textContent = `${request.name || request.username} (${request.username})`;
          contact.textContent = request.accountExists
            ? request.telefoonnummer || "Geen telefoonnummer geregistreerd"
            : "Geen cliëntaccount gevonden met deze gebruikersnaam";
          date.textContent = `Status: ${request.status === "in_behandeling" ? "In behandeling" : "Nieuw"} · Aangevraagd op ${new Date(request.createdAt).toLocaleString("nl-NL")}`;
          inProgressButton.className = "secondary-button";
          inProgressButton.type = "button";
          inProgressButton.textContent = "In behandeling";
          resolveButton.className = "secondary-button";
          resolveButton.type = "button";
          resolveButton.textContent = "Afgehandeld";
          const updateRequestStatus = async (status, button) => {
            settingsError.hidden = true;
            button.disabled = true;
            try {
              const resolveResponse = await fetch(`/api/consultant/password-reset-requests/${encodeURIComponent(request.id)}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status }),
              });
              const result = await resolveResponse.json();
              if (!resolveResponse.ok) throw new Error(result.error || "Aanvraag afhandelen is mislukt.");
              await loadPasswordResetRequests();
            } catch (error) {
              settingsError.textContent = error.message || "Aanvraag afhandelen is mislukt.";
              settingsError.hidden = false;
              button.disabled = false;
            }
          };
          inProgressButton.addEventListener("click", () => updateRequestStatus("in_behandeling", inProgressButton));
          resolveButton.addEventListener("click", () => updateRequestStatus("afgehandeld", resolveButton));

          details.append(title, contact, date);
          actions.append(inProgressButton, resolveButton);
          item.append(details, actions);
          list.append(item);
        }
      } catch (error) {
        settingsError.textContent = error.message || "Wachtwoordaanvragen konden niet worden geladen.";
        settingsError.hidden = false;
      }
    }

    async function loadConsultantSettings() {
      try {
        const response = await fetch("/api/consultant/settings");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Instellingen konden niet worden geladen.");

        const consultant = result;
        const fields = {
          voornaam: consultant.voornaam || "",
          tussenvoegsel: consultant.tussenvoegsel || "",
          achternaam: consultant.achternaam || "",
          telefoonnummer: consultant.telefoonnummer || "",
          email: consultant.email || "",
          role: consultant.role || "consultant",
          defaultlocatie: consultant.location_name || "",
          adres: consultant.adres || "",
          postcode: consultant.postcode || "",
          plaats: consultant.plaats || "",
          start_werkdag: consultant.start_werkdag || "",
          einde_werkdag: consultant.einde_werkdag || "",
          created_at: consultant.aanmaakdatum ? new Date(consultant.aanmaakdatum).toLocaleString("nl-NL") : "",
        };

        document.querySelector("#setting-first-name").value = fields.voornaam;
        document.querySelector("#setting-prefix").value = fields.tussenvoegsel;
        document.querySelector("#setting-last-name").value = fields.achternaam;
        document.querySelector("#setting-email").value = fields.email;
        document.querySelector("#setting-phone").value = fields.telefoonnummer;
        document.querySelector("#setting-role").value = fields.role;
        document.querySelector("#setting-default-location").value = fields.defaultlocatie;
        document.querySelector("#setting-adres").value = fields.adres;
        document.querySelector("#setting-postcode").value = fields.postcode;
        document.querySelector("#setting-plaats").value = fields.plaats;
        for (const checkbox of document.querySelectorAll("[data-weekday]")) {
          const isWorkday = typeof consultant.werkdagen === "string"
            && consultant.werkdagen.toLocaleLowerCase("nl-NL").includes(checkbox.dataset.weekday.toLocaleLowerCase("nl-NL"));
          checkbox.checked = isWorkday;
        }
        document.querySelector("#setting-start-werkdag").value = fields.start_werkdag;
        document.querySelector("#setting-einde-werkdag").value = fields.einde_werkdag;
        const name = [consultant.voornaam, consultant.tussenvoegsel, consultant.achternaam].filter(Boolean).join(" ") || "Instellingen";
        const username = consultant.username ? ` (${consultant.username})` : "";
        document.querySelector("#consultant-name").textContent = `${name}${username}`;
      } catch (error) {
        settingsError.textContent = error.message || "Instellingen konden niet worden geladen.";
        settingsError.hidden = false;
      }
    }

    document.querySelector("#back-button").addEventListener("click", () => {
      window.location.href = "/";
    });
    document.querySelector("#cancel-button").addEventListener("click", () => {
      window.location.href = "/";
    });
    document.querySelector("#save-button").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      const status = document.querySelector("#settings-status");
      settingsError.hidden = true;
      status.hidden = true;
      button.disabled = true;
      const werkdagen = [...document.querySelectorAll("[data-weekday]:checked")]
        .map((checkbox) => checkbox.dataset.weekday);
      try {
        const response = await fetch("/api/consultant/settings/workdays", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ werkdagen }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Werkdagen konden niet worden opgeslagen.");
        status.textContent = "Werkdagen zijn opgeslagen.";
        status.hidden = false;
      } catch (error) {
        settingsError.textContent = error.message || "Werkdagen konden niet worden opgeslagen.";
        settingsError.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
    document.querySelector("#logout-button").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/logout", { method: "POST" });
        if (!response.ok) throw new Error("Uitloggen is mislukt.");
        window.location.href = "/login";
      } catch (error) {
        settingsError.textContent = error.message || "Uitloggen is mislukt.";
        settingsError.hidden = false;
      }
    });

    loadConsultantSettings();
    loadPasswordResetRequests();
  </script>
</body>
</html>
