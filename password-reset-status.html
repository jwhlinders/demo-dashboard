<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Aanvraagstatus | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="status-title">
      <a class="brand login-brand" href="/login" aria-label="Cliëntenagenda">
        <span class="brand-mark" aria-hidden="true">&#128197;</span>
        <span>Cliëntenagenda</span>
      </a>
      <p class="eyebrow">Account herstellen</p>
      <h1 id="status-title">Aanvraagstatus bekijken</h1>
      <p class="login-copy">Vul de gebruikersnaam en statuscode in die je bij je aanvraag hebt ontvangen. Zodra de beheerder de aanvraag heeft afgehandeld, kun je hier een nieuw wachtwoord instellen.</p>
      <form id="reset-status-form">
        <label class="field" for="reset-username">
          <span>Gebruikersnaam</span>
          <input id="reset-username" name="username" type="text" maxlength="80" autocomplete="username" required>
        </label>
        <label class="field" for="tracking-code">
          <span>Statuscode (8 tekens)</span>
          <input id="tracking-code" name="trackingCode" type="text" minlength="8" maxlength="48" autocomplete="off" required autofocus>
        </label>
        <label class="field" for="new-password">
          <span>Nieuw wachtwoord</span>
          <input id="new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </label>
        <label class="field" for="confirm-password">
          <span>Herhaal wachtwoord</span>
          <input id="confirm-password" name="passwordConfirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </label>
        <p class="login-error" id="status-error" role="alert" hidden></p>
        <p class="register-success" id="status-result" role="status" hidden></p>
        <p class="login-copy" id="request-status" role="status" hidden></p>
        <button class="primary-button" id="create-password-button" type="submit" disabled>Aanmaken wachtwoord</button>
      </form>
      <p class="login-copy register-prompt"><a href="/login">Terug naar inloggen</a></p>
    </section>
  </main>
  <script>
    const statusLabels = {
      nieuw: "Nieuw: je aanvraag wacht op behandeling door de beheerder.",
      in_behandeling: "In behandeling: de beheerder werkt aan je aanvraag.",
      afgehandeld: "Afgehandeld: je kunt nu hieronder een nieuw wachtwoord instellen.",
      wachtwoord_gewijzigd: "Voor deze aanvraag is het wachtwoord al gewijzigd. Je kunt nu inloggen.",
    };

    const form = document.querySelector("#reset-status-form");
    const trackingCodeInput = form.elements.trackingCode;
    const usernameInput = form.elements.username;
    const passwordInput = form.elements.password;
    const passwordConfirmationInput = form.elements.passwordConfirmation;
    const createPasswordButton = document.querySelector("#create-password-button");
    const error = document.querySelector("#status-error");
    const resultElement = document.querySelector("#status-result");
    const requestStatus = document.querySelector("#request-status");
    let statusCheckTimer;
    let statusCheckId = 0;
    let canCreatePassword = false;

    function updateCreatePasswordButton() {
      const fieldsFilled = Boolean(
        usernameInput.value.trim()
        && trackingCodeInput.value.trim()
        && passwordInput.value
        && passwordConfirmationInput.value
      );
      createPasswordButton.disabled = !canCreatePassword || !fieldsFilled;
    }

    async function checkRequestStatus() {
      const currentCheckId = ++statusCheckId;
      clearTimeout(statusCheckTimer);
      canCreatePassword = false;
      updateCreatePasswordButton();
      requestStatus.hidden = true;
      resultElement.hidden = true;
      error.hidden = true;

      const username = usernameInput.value.trim();
      const trackingCode = trackingCodeInput.value.trim();
      if (!username || !(/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/i.test(trackingCode) || /^[a-f0-9]{48}$/i.test(trackingCode))) return;

      try {
        const response = await fetch("/api/password-reset-status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, trackingCode }),
        });
        const result = await response.json();
        if (currentCheckId !== statusCheckId) return;
        if (!response.ok) throw new Error(result.error || "Aanvraagstatus kon niet worden opgehaald.");
        requestStatus.textContent = statusLabels[result.status] || "Onbekende aanvraagstatus.";
        requestStatus.hidden = false;
        canCreatePassword = result.status === "afgehandeld";
        updateCreatePasswordButton();
      } catch (lookupError) {
        if (currentCheckId !== statusCheckId) return;
        error.textContent = lookupError.message || "Aanvraagstatus kon niet worden opgehaald.";
        error.hidden = false;
      }
    }

    function scheduleStatusCheck() {
      clearTimeout(statusCheckTimer);
      statusCheckTimer = setTimeout(checkRequestStatus, 350);
    }

    usernameInput.addEventListener("input", scheduleStatusCheck);
    trackingCodeInput.addEventListener("input", scheduleStatusCheck);
    passwordInput.addEventListener("input", updateCreatePasswordButton);
    passwordConfirmationInput.addEventListener("input", updateCreatePasswordButton);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!canCreatePassword) return;
      error.hidden = true;
      resultElement.hidden = true;
      createPasswordButton.disabled = true;
      try {
        const response = await fetch("/api/password-reset-complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            trackingCode: trackingCodeInput.value.trim(),
            password: form.elements.password.value,
            passwordConfirmation: form.elements.passwordConfirmation.value,
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Wachtwoord wijzigen is mislukt.");
        canCreatePassword = false;
        form.elements.password.value = "";
        form.elements.passwordConfirmation.value = "";
        resultElement.textContent = result.message;
        resultElement.hidden = false;
        requestStatus.hidden = true;
      } catch (lookupError) {
        error.textContent = lookupError.message || "Wachtwoord wijzigen is mislukt.";
        error.hidden = false;
        await checkRequestStatus();
      }
    });
  </script>
</body>
</html>
