<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Locatie toevoegen | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="settings-page">
  <header class="site-header">
    <div class="brand" aria-label="Agenda">
      <span class="brand-mark" aria-hidden="true">&#128197;</span>
      <div class="brand-copy">
        <span>Locatie toevoegen</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="logout-button" id="logout-button" type="button" aria-label="Uitloggen" title="Uitloggen">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="settings-shell">
    <section class="settings-panel" aria-labelledby="location-title">
      <div class="settings-topbar">
        <div class="settings-heading">
          <p class="eyebrow">Beheer</p>
          <h1 id="location-title">Nieuwe locatie</h1>
        </div>
      </div>

      <form class="settings-form" id="location-form">
        <section class="settings-section" aria-label="Locatiegegevens">
          <div class="settings-stack">
            <div class="field-row">
              <label class="field-label" for="location-name">Naam</label>
              <input id="location-name" name="naam" type="text" maxlength="100" required>
            </div>
            <div class="field-row">
              <label class="field-label" for="location-address">Adres</label>
              <input id="location-address" name="adres" type="text" maxlength="100" autocomplete="street-address" required>
            </div>
            <div class="field-row">
              <label class="field-label" for="location-postcode">Postcode</label>
              <input id="location-postcode" name="postcode" type="text" maxlength="7" pattern="[0-9]{4}\s?[A-Za-z]{2}" title="Vul een Nederlandse postcode in, bijvoorbeeld 1234 AB." autocomplete="postal-code" autocapitalize="characters" required>
            </div>
            <div class="field-row">
              <label class="field-label" for="location-city">Woonplaats</label>
              <input id="location-city" name="woonplaats" type="text" maxlength="50" autocomplete="address-level2" required>
            </div>
            <div class="field-row">
              <label class="field-label" for="location-phone">Telefoonnummer</label>
              <input id="location-phone" name="telefoonnummer" type="tel" maxlength="12" autocomplete="tel">
            </div>
            <div class="field-row">
              <span class="field-label">Status</span>
              <label class="weekday-option location-active-option">
                <input id="location-active" name="actief" type="checkbox" checked>
                <span>Actief</span>
              </label>
            </div>
          </div>
        </section>

        <p id="location-status" class="settings-status" role="status" hidden></p>
        <p id="location-error" class="login-error" role="alert" hidden></p>
        <div class="settings-actions">
          <button class="secondary-button" id="cancel-button" type="button">Annuleren</button>
          <button class="primary-button" id="save-button" type="submit">Opslaan</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector("#location-form");
    const errorMessage = document.querySelector("#location-error");
    const statusMessage = document.querySelector("#location-status");
    const saveButton = document.querySelector("#save-button");

    document.querySelector("#cancel-button").addEventListener("click", () => {
      window.location.href = "/";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorMessage.hidden = true;
      statusMessage.hidden = true;
      saveButton.disabled = true;

      const formData = new FormData(form);
      try {
        const response = await fetch("/api/locaties", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            naam: formData.get("naam"),
            adres: formData.get("adres"),
            postcode: formData.get("postcode"),
            woonplaats: formData.get("woonplaats"),
            telefoonnummer: formData.get("telefoonnummer"),
            actief: formData.get("actief") === "on",
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Locatie opslaan is mislukt.");

        statusMessage.textContent = result.message;
        statusMessage.hidden = false;
        form.reset();
      } catch (error) {
        errorMessage.textContent = error.message || "Locatie opslaan is mislukt.";
        errorMessage.hidden = false;
      } finally {
        saveButton.disabled = false;
      }
    });

    document.querySelector("#logout-button").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/logout", { method: "POST" });
        if (!response.ok) throw new Error("Uitloggen is mislukt.");
        window.location.href = "/login";
      } catch (error) {
        errorMessage.textContent = error.message || "Uitloggen is mislukt.";
        errorMessage.hidden = false;
      }
    });
  </script>
</body>
</html>
