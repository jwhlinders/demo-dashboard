<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Nieuw wachtwoord | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="password-title">
      <div class="brand login-brand" aria-label="Agenda">
        <span class="brand-mark" aria-hidden="true">&#128197;</span>
        <span>Cliëntenagenda</span>
      </div>
      <p class="eyebrow">Eerste keer inloggen</p>
      <h1 id="password-title">Kies een nieuw wachtwoord</h1>
      <p class="login-copy">Je tijdelijke wachtwoord moet eerst worden vervangen.</p>
      <form id="password-form">
        <label class="field" for="password-username">
          <span>Gebruikersnaam</span>
          <input id="password-username" name="username" type="text" autocomplete="username" readonly aria-readonly="true">
        </label>
        <label class="field" for="new-password">
          <span>Nieuw wachtwoord</span>
          <input id="new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required autofocus>
        </label>
        <label class="field" for="confirm-password">
          <span>Herhaal wachtwoord</span>
          <input id="confirm-password" name="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </label>
        <p class="login-error" id="password-error" role="alert" hidden></p>
        <button class="primary-button" type="submit">Wachtwoord opslaan</button>
      </form>
    </section>
  </main>
  <script>
    async function loadUsername() {
      const error = document.querySelector("#password-error");
      try {
        const response = await fetch("/api/change-password");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Gebruikersnaam laden is mislukt.");
        document.querySelector("#password-username").value = result.username;
      } catch (loadError) {
        error.textContent = loadError.message || "Gebruikersnaam laden is mislukt. Controleer je verbinding.";
        error.hidden = false;
      }
    }

    loadUsername();

    document.querySelector("#password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.querySelector("#password-error");
      const password = form.elements.password.value;
      error.hidden = true;
      if (password !== form.elements.confirmation.value) {
        error.textContent = "De wachtwoorden komen niet overeen.";
        error.hidden = false;
        return;
      }
      try {
        const response = await fetch("/api/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Wachtwoord wijzigen is mislukt.");
        window.location.href = "/";
      } catch (changeError) {
        error.textContent = changeError.message || "Wachtwoord wijzigen is mislukt. Controleer je verbinding.";
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
