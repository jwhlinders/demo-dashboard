<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Instellingen | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="settings-page">
  <header class="site-header">
    <div class="brand" aria-label="Agenda">
      <span class="brand-mark" aria-hidden="true">&#128197;</span>
      <div class="brand-copy">
        <span id="consultant-name">Instellingen</span>
        <span class="brand-location" id="consultant-location" hidden></span>
      </div>
    </div>
    <div class="header-actions">
      <button class="secondary-button" id="back-button" type="button">Terug</button>
      <button class="logout-button" id="logout-button" type="button" aria-label="Uitloggen" title="Uitloggen">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="settings-shell">
    <section class="settings-panel" aria-labelledby="settings-title">
      <div class="settings-topbar">
        <div class="settings-heading">
          <p class="eyebrow" id="settings-eyebrow">Accountgegevens</p>
          <h1 id="settings-title">Instellingen</h1>
        </div>
      </div>

      <form class="settings-form" id="settings-form">
        <section class="settings-section" aria-labelledby="contact-details-title">
          <h3 id="contact-details-title">Contactgegevens</h3>
          <div class="settings-stack">
            <div class="field-row field-row-name">
              <span class="field-label">Naam</span>
              <div class="field-inline-grid">
                <div class="subfield">
                  <label for="setting-first-name">Voornaam</label>
                  <input id="setting-first-name" name="voornaam" type="text" maxlength="20" autocomplete="given-name">
                </div>
                <div class="subfield">
                  <label for="setting-prefix">Tussenvoegsel</label>
                  <input id="setting-prefix" name="tussenvoegsel" type="text" maxlength="20">
                </div>
                <div class="subfield">
                  <label for="setting-last-name">Achternaam</label>
                  <input id="setting-last-name" name="achternaam" type="text" maxlength="40" autocomplete="family-name">
                </div>
              </div>
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-email">E-mailadres</label>
              <input id="setting-email" name="email" type="email" maxlength="254" autocomplete="email" required>
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-phone">Telefoonnummer</label>
              <input id="setting-phone" name="telefoonnummer" type="tel" maxlength="30" autocomplete="tel">
            </div>

            <div class="field-row" id="setting-username-row" hidden>
              <label class="field-label" for="setting-username">Gebruikersnaam</label>
              <input id="setting-username" name="username" type="text" maxlength="80" autocomplete="username">
            </div>

            <div class="field-row" id="setting-authorisatiecode-row" hidden>
              <label class="field-label" for="setting-authorisatiecode">Authorisatiecode</label>
              <input id="setting-authorisatiecode" name="authorisatiecode" type="text" readonly aria-readonly="true" placeholder="Wordt gegenereerd bij opslaan">
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="consultant-address-title">
          <h3 id="consultant-address-title">Adresgegevens</h3>
          <div class="settings-stack">
            <div class="field-row">
              <label class="field-label" for="setting-home-street">Straat</label>
              <input id="setting-home-street" name="straat" type="text" maxlength="100" autocomplete="street-address">
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-home-postcode">Postcode</label>
              <input id="setting-home-postcode" name="postcode" type="text" maxlength="7" pattern="[0-9]{4}\s?[A-Za-z]{2}" title="Vul een postcode in, bijvoorbeeld 1234 AB." autocomplete="postal-code" autocapitalize="characters">
            </div>

            <div class="field-row">
              <label class="field-label" for="setting-home-city">Woonplaats</label>
              <input id="setting-home-city" name="woonplaats" type="text" maxlength="50" autocomplete="address-level2">
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="work-location-title">
          <h3 id="work-location-title">Werklocatie</h3>
          <div class="settings-stack">
            <div class="field-row">
              <label class="field-label" for="setting-default-location">Naam</label>
              <select id="setting-default-location" name="defaultlocatie" required disabled>
                <option value="">Locaties laden...</option>
              </select>
            </div>

            <div class="field-row field-row-address">
              <span class="field-label">Adres</span>
              <div class="field-inline-grid no-sub-labels">
                <input id="setting-adres" name="adres" type="text" readonly aria-readonly="true" tabindex="-1">
                <input id="setting-postcode" name="postcode" type="text" readonly aria-readonly="true" tabindex="-1">
                <input id="setting-plaats" name="plaats" type="text" readonly aria-readonly="true" tabindex="-1">
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="other-details-title">
          <h3 id="other-details-title">Overige gegevens</h3>
          <div class="settings-stack">
            <div class="field-row">
              <label class="field-label" for="setting-role">Functie</label>
              <input id="setting-role" name="functie" type="text" maxlength="80" required>
            </div>

            <div class="field-row">
              <span class="field-label">Werkdagen</span>
              <div class="weekday-list" role="group" aria-label="Werkdagen">
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Ma">
                  <span>Ma</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Di">
                  <span>Di</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Wo">
                  <span>Wo</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Do">
                  <span>Do</span>
                </label>
                <label class="weekday-option">
                  <input type="checkbox" data-weekday="Vr">
                  <span>Vr</span>
                </label>
              </div>
            </div>

            <div class="field-row field-row-hours">
              <span class="field-label">Werktijden</span>
              <div class="time-inline no-sub-labels">
                <input id="setting-start-werkdag" name="start_werkdag" type="time" required>
                <span class="time-separator">t/m</span>
                <input id="setting-einde-werkdag" name="einde_werkdag" type="time" required>
              </div>
            </div>

          </div>
        </section>

        <div class="settings-actions">
          <button class="secondary-button" id="cancel-button" type="button">Annuleren</button>
          <button class="primary-button" type="button" id="save-button">Opslaan</button>
          <button class="secondary-button" id="add-another-consultant-button" type="button" hidden>Nieuw consultant</button>
          <button class="primary-button" id="done-adding-consultants-button" type="button" hidden>OK</button>
        </div>
      </form>
      <section class="settings-form" aria-labelledby="password-reset-requests-title">
        <section class="settings-section" aria-labelledby="password-reset-requests-title">
          <h3 id="password-reset-requests-title">Wachtwoordaanvragen</h3>
          <p class="settings-status" id="password-reset-requests-empty">Er zijn geen open wachtwoordaanvragen.</p>
          <ul class="password-reset-list" id="password-reset-requests"></ul>
        </section>
      </section>
      <p id="settings-status" class="settings-status" role="status" hidden></p>
      <p id="settings-error" class="login-error" role="alert" hidden></p>
    </section>
  </main>

  <script>
    const settingsError = document.querySelector("#settings-error");
    let locationsById = new Map();
    let creatingConsultant = false;
    let consultantCreated = false;
    const isDedicatedConsultantPage = window.location.pathname === "/beheer-consultant";
    const createConsultantRequested = isDedicatedConsultantPage
      || new URLSearchParams(window.location.search).get("new-consultant") === "true";

    function setConsultantFieldsReadOnly(readOnly) {
      for (const input of document.querySelectorAll("#settings-form input")) {
        if (input.type === "checkbox") {
          input.disabled = readOnly;
        } else if (!["setting-adres", "setting-postcode", "setting-plaats", "setting-authorisatiecode"].includes(input.id)) {
          input.readOnly = readOnly;
        }
      }
      for (const select of document.querySelectorAll("#settings-form select")) {
        select.disabled = readOnly;
      }
    }

    function setConsultantFormMode(isCreating) {
      creatingConsultant = isCreating;
      consultantCreated = false;
      document.querySelector("#settings-eyebrow").textContent = isCreating ? "Nieuw account" : "Accountgegevens";
      document.querySelector("#settings-title").textContent = isCreating ? "Nieuw consultant" : "Instellingen";
      document.querySelector("#password-reset-requests-title").closest(".settings-form").hidden = isCreating;
      document.querySelector("#setting-username-row").hidden = !isCreating;
      document.querySelector("#setting-authorisatiecode-row").hidden = !isCreating;
      document.querySelector("#setting-username").required = isCreating;
      for (const fieldId of ["setting-home-street", "setting-home-postcode", "setting-home-city"]) {
        document.querySelector(`#${fieldId}`).required = isCreating;
      }
      const saveButton = document.querySelector("#save-button");
      saveButton.textContent = isCreating ? "Consultant toevoegen" : "Opslaan";
      saveButton.disabled = false;
      document.querySelector("#cancel-button").hidden = false;
      saveButton.hidden = false;
      document.querySelector("#add-another-consultant-button").hidden = true;
      document.querySelector("#done-adding-consultants-button").hidden = true;
      document.querySelector("#setting-authorisatiecode").value = "";
      setConsultantFieldsReadOnly(false);
      if (isCreating) {
        document.querySelector("#settings-form").reset();
        document.querySelector("#setting-default-location").value = "";
        updateLocationDetails();
      } else {
        loadConsultantSettings();
      }
    }

    function updateLocationDetails() {
      const location = locationsById.get(document.querySelector("#setting-default-location").value);
      for (const fieldId of ["setting-adres", "setting-postcode", "setting-plaats"]) {
        const field = document.querySelector(`#${fieldId}`);
        field.readOnly = true;
        field.setAttribute("aria-readonly", "true");
      }
      const addressFields = {
        "setting-adres": location?.adres || "",
        "setting-postcode": location?.postcode || "",
        "setting-plaats": location?.plaats || "",
      };
      for (const [fieldId, value] of Object.entries(addressFields)) {
        document.querySelector(`#${fieldId}`).value = value;
      }
    }

    document.querySelector("#setting-default-location").addEventListener("change", updateLocationDetails);

    async function loadPasswordResetRequests() {
      const list = document.querySelector("#password-reset-requests");
      const emptyMessage = document.querySelector("#password-reset-requests-empty");
      try {
        const response = await fetch("/api/consultant/password-reset-requests");
        const requests = await response.json();
        if (!response.ok) throw new Error(requests.error || "Wachtwoordaanvragen konden niet worden geladen.");

        list.replaceChildren();
        emptyMessage.hidden = requests.length > 0;
        for (const request of requests) {
          const item = document.createElement("li");
          const details = document.createElement("div");
          const title = document.createElement("strong");
          const contact = document.createElement("p");
          const date = document.createElement("p");
          const actions = document.createElement("div");
          const inProgressButton = document.createElement("button");
          const resolveButton = document.createElement("button");

          const accountType = request.accountType === "client"
            ? "Cliënt"
            : request.accountType === "consultant" ? "Consultant" : "";
          title.textContent = `${request.name || request.username} (${request.username})${accountType ? ` · ${accountType}` : ""}`;
          contact.textContent = request.telefoonnummer || "Geen telefoonnummer geregistreerd";
          date.textContent = `Status: ${request.status === "in_behandeling" ? "In behandeling" : "Nieuw"} · Aangevraagd op ${new Date(request.createdAt).toLocaleString("nl-NL")}`;
          inProgressButton.className = "secondary-button";
          inProgressButton.type = "button";
          inProgressButton.textContent = "In behandeling";
          resolveButton.className = "secondary-button";
          resolveButton.type = "button";
          resolveButton.textContent = "Afgehandeld";
          const updateRequestStatus = async (status, button) => {
            settingsError.hidden = true;
            button.disabled = true;
            try {
              const resolveResponse = await fetch(`/api/consultant/password-reset-requests/${encodeURIComponent(request.id)}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status }),
              });
              const result = await resolveResponse.json();
              if (!resolveResponse.ok) throw new Error(result.error || "Aanvraag afhandelen is mislukt.");
              await loadPasswordResetRequests();
            } catch (error) {
              settingsError.textContent = error.message || "Aanvraag afhandelen is mislukt.";
              settingsError.hidden = false;
              button.disabled = false;
            }
          };
          inProgressButton.addEventListener("click", () => updateRequestStatus("in_behandeling", inProgressButton));
          resolveButton.addEventListener("click", () => updateRequestStatus("afgehandeld", resolveButton));

          details.append(title, contact, date);
          actions.append(inProgressButton, resolveButton);
          item.append(details, actions);
          list.append(item);
        }
      } catch (error) {
        settingsError.textContent = error.message || "Wachtwoordaanvragen konden niet worden geladen.";
        settingsError.hidden = false;
      }
    }

    async function loadConsultantSettings() {
      try {
        const response = await fetch("/api/consultant/settings");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Instellingen konden niet worden geladen.");

        const locationsResponse = await fetch("/api/consultant/settings/locations");
        const locations = await locationsResponse.json();
        if (!locationsResponse.ok) throw new Error(locations.error || "Locaties konden niet worden geladen.");

        const consultant = result;
        const isBeheerder = typeof consultant.functie === "string"
          && consultant.functie.trim().toLocaleLowerCase("nl-NL") === "beheerder";
        const fields = {
          voornaam: consultant.voornaam || "",
          tussenvoegsel: consultant.tussenvoegsel || "",
          achternaam: consultant.achternaam || "",
          telefoonnummer: consultant.telefoonnummer || "",
          email: consultant.email || "",
          role: consultant.functie || "",
          defaultlocatie: consultant.location_name || "",
          start_werkdag: consultant.start_werkdag || "",
          einde_werkdag: consultant.einde_werkdag || "",
          created_at: consultant.aanmaakdatum ? new Date(consultant.aanmaakdatum).toLocaleString("nl-NL") : "",
        };

        document.querySelector("#setting-first-name").value = fields.voornaam;
        document.querySelector("#setting-prefix").value = fields.tussenvoegsel;
        document.querySelector("#setting-last-name").value = fields.achternaam;
        document.querySelector("#setting-email").value = fields.email;
        document.querySelector("#setting-phone").value = fields.telefoonnummer;
        document.querySelector("#setting-home-street").value = consultant.address_street || "";
        document.querySelector("#setting-home-postcode").value = consultant.address_postcode || "";
        document.querySelector("#setting-home-city").value = consultant.address_city || "";
        document.querySelector("#setting-role").value = fields.role;
        const locationSelect = document.querySelector("#setting-default-location");
        locationsById = new Map(locations.map((location) => [String(location.id), location]));
        locationSelect.replaceChildren(...locations.map((location) => new Option(location.naam, String(location.id))));
        locationSelect.value = String(consultant.defaultlocatie || "");
        locationSelect.disabled = locations.length === 0;
        updateLocationDetails();
        for (const checkbox of document.querySelectorAll("[data-weekday]")) {
          const isWorkday = typeof consultant.werkdagen === "string"
            && consultant.werkdagen.toLocaleLowerCase("nl-NL").includes(checkbox.dataset.weekday.toLocaleLowerCase("nl-NL"));
          checkbox.checked = isWorkday;
        }
        document.querySelector("#setting-start-werkdag").value = fields.start_werkdag;
        document.querySelector("#setting-einde-werkdag").value = fields.einde_werkdag;
        const name = [consultant.voornaam, consultant.tussenvoegsel, consultant.achternaam].filter(Boolean).join(" ") || "Instellingen";
        const username = consultant.username ? ` (${consultant.username})` : "";
        document.querySelector("#consultant-name").textContent = `${name}${username}`;
        const locationLabel = document.querySelector("#consultant-location");
        locationLabel.textContent = fields.defaultlocatie ? `Locatie: ${fields.defaultlocatie}` : "";
        locationLabel.hidden = !fields.defaultlocatie;
        if (isBeheerder && createConsultantRequested) {
          setConsultantFormMode(true);
          window.history.replaceState(null, "", window.location.pathname);
        }
      } catch (error) {
        settingsError.textContent = error.message || "Instellingen konden niet worden geladen.";
        settingsError.hidden = false;
      }
    }

    document.querySelector("#back-button").addEventListener("click", () => {
      window.location.href = "/";
    });
    document.querySelector("#cancel-button").addEventListener("click", () => {
      if (creatingConsultant) {
        if (isDedicatedConsultantPage) {
          window.location.href = "/";
          return;
        }
        setConsultantFormMode(false);
        document.querySelector("#settings-status").hidden = true;
        settingsError.hidden = true;
      } else {
        window.location.href = "/";
      }
    });
    document.querySelector("#add-another-consultant-button").addEventListener("click", () => {
      setConsultantFormMode(true);
      document.querySelector("#settings-status").hidden = true;
      settingsError.hidden = true;
    });
    document.querySelector("#done-adding-consultants-button").addEventListener("click", () => {
      if (isDedicatedConsultantPage) {
        window.location.href = "/";
        return;
      }
      setConsultantFormMode(false);
      document.querySelector("#settings-status").hidden = true;
      settingsError.hidden = true;
    });
    document.querySelector("#save-button").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      if (!document.querySelector("#settings-form").reportValidity()) return;
      const status = document.querySelector("#settings-status");
      settingsError.hidden = true;
      status.hidden = true;
      button.disabled = true;
      const werkdagen = [...document.querySelectorAll("[data-weekday]:checked")]
        .map((checkbox) => checkbox.dataset.weekday);
      try {
        const locationSelect = document.querySelector("#setting-default-location");
        if (!locationSelect.value) throw new Error("Kies een werklocatie.");
        const voornaam = document.querySelector("#setting-first-name").value.trim();
        const tussenvoegsel = document.querySelector("#setting-prefix").value.trim();
        const achternaam = document.querySelector("#setting-last-name").value.trim();
        const name = [voornaam, tussenvoegsel, achternaam].filter(Boolean).join(" ");
        const isCreating = creatingConsultant;
        const requestBody = {
          voornaam,
          tussenvoegsel,
          achternaam,
          email: document.querySelector("#setting-email").value.trim(),
          telefoonnummer: document.querySelector("#setting-phone").value.trim(),
          straat: document.querySelector("#setting-home-street").value.trim(),
          postcode: document.querySelector("#setting-home-postcode").value.trim(),
          woonplaats: document.querySelector("#setting-home-city").value.trim(),
          functie: document.querySelector("#setting-role").value.trim(),
          start_werkdag: document.querySelector("#setting-start-werkdag").value,
          einde_werkdag: document.querySelector("#setting-einde-werkdag").value,
          werkdagen,
          defaultlocatie: Number(locationSelect.value),
        };
        if (isCreating) requestBody.username = document.querySelector("#setting-username").value.trim();
        const response = await fetch(isCreating ? "/api/consultants" : "/api/consultant/settings", {
          method: isCreating ? "POST" : "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Instellingen konden niet worden opgeslagen.");
        if (isCreating) {
          document.querySelector("#setting-authorisatiecode").value = result.authorisatiecode;
          consultantCreated = true;
          setConsultantFieldsReadOnly(true);
          document.querySelector("#cancel-button").hidden = true;
          button.hidden = true;
          document.querySelector("#add-another-consultant-button").hidden = false;
          document.querySelector("#done-adding-consultants-button").hidden = false;
          status.textContent = "Consultant is aangemaakt. Bewaar de authorisatiecode.";
          status.hidden = false;
          return;
        }
        const username = document.querySelector("#consultant-name").textContent.match(/\(([^)]+)\)$/)?.[0] || "";
        document.querySelector("#consultant-name").textContent = `${name || "Instellingen"} ${username}`.trim();
        const locationLabel = document.querySelector("#consultant-location");
        locationLabel.textContent = `Locatie: ${locationSelect.selectedOptions[0].textContent}`;
        locationLabel.hidden = false;
        status.textContent = "Instellingen zijn opgeslagen.";
        status.hidden = false;
      } catch (error) {
        settingsError.textContent = error.message || "Instellingen konden niet worden opgeslagen.";
        settingsError.hidden = false;
      } finally {
        button.disabled = creatingConsultant && consultantCreated;
      }
    });
    document.querySelector("#logout-button").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/logout", { method: "POST" });
        if (!response.ok) throw new Error("Uitloggen is mislukt.");
        window.location.href = "/login";
      } catch (error) {
        settingsError.textContent = error.message || "Uitloggen is mislukt.";
        settingsError.hidden = false;
      }
    });

    loadConsultantSettings();
    loadPasswordResetRequests();
  </script>
</body>
</html>
