<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Inloggen | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-menu">
        <button class="login-menu-toggle" id="login-menu-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="login-menu">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <nav class="login-menu-items" id="login-menu" aria-label="Hoofdnavigatie" hidden>
          <a href="/password-reset-status">Opvragen status</a>
          <a href="/password-reset-request">Reset wachtwoord</a>
          <a href="/register">Registreer (cliënt)</a>
          <a href="/consultant">Registreer (consultant)</a>
        </nav>
      </div>
      <div class="brand login-brand" aria-label="Agenda">
        <span class="brand-mark" aria-hidden="true">&#128197;</span>
        <span>Cliëntenagenda</span>
      </div>
      <p class="eyebrow">Beveiligde omgeving</p>
      <h1 id="login-title">Welkom terug</h1>
      <p class="login-copy">Log in om je agenda te bekijken.</p>
      <form id="login-form">
        <label class="field" for="username">
          <span>Gebruikersnaam</span>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label class="field" for="password">
          <span>Wachtwoord</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="primary-button" type="submit">Inloggen</button>
      </form>
    </section>
  </main>
  <script>
    const loginMenuToggle = document.querySelector("#login-menu-toggle");
    const loginMenu = document.querySelector("#login-menu");
    const setLoginMenuOpen = (isOpen) => {
      loginMenu.hidden = !isOpen;
      loginMenuToggle.setAttribute("aria-expanded", String(isOpen));
      loginMenuToggle.setAttribute("aria-label", isOpen ? "Menu sluiten" : "Menu openen");
    };
    loginMenuToggle.addEventListener("click", () => {
      setLoginMenuOpen(loginMenuToggle.getAttribute("aria-expanded") !== "true");
    });
    loginMenu.addEventListener("click", (event) => {
      if (event.target.closest("a")) setLoginMenuOpen(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !loginMenu.hidden) {
        setLoginMenuOpen(false);
        loginMenuToggle.focus();
      }
    });

    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.querySelector("#login-error");
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Ongeldige gebruikersnaam of wachtwoord.");
        window.location.href = result.mustChangePassword ? "/change-password" : "/dashboard";
      } catch (loginError) {
        error.textContent = loginError.message || "Inloggen is mislukt. Controleer je verbinding.";
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
