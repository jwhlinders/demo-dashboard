image: node:22-bookworm

services:
  - name: postgres:17-alpine
    alias: postgres

variables:
  POSTGRES_DB: mijn_dashboard
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mijn_dashboard
  E2E_CONSULTANT_USERNAME: ci-consultant
  E2E_CONSULTANT_PASSWORD: CIConsultant2026!
  E2E_CLIENT_USERNAME: ci-client
  E2E_CLIENT_PASSWORD: CIClient2026!

stages:
  - test

e2e:
  stage: test
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends postgresql-client
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - for attempt in $(seq 1 30); do pg_isready --host=postgres --username=postgres --dbname=mijn_dashboard && break; sleep 1; done
    - pg_isready --host=postgres --username=postgres --dbname=mijn_dashboard
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/ci-schema.sql
    - npm run test:e2e -- --workers=1
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 week
