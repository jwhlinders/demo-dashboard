name: Playwright tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    outputs:
      report-available: ${{ steps.report.outputs.available }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mijn_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=mijn_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mijn_dashboard
      E2E_CONSULTANT_USERNAME: ci-consultant
      E2E_CONSULTANT_PASSWORD: CIConsultant2026!
      E2E_CLIENT_USERNAME: ci-client
      E2E_CLIENT_PASSWORD: CIClient2026!

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/ci-schema.sql

      - name: Run Playwright tests
        run: npm run test:e2e -- --workers=1 --reporter=html,list

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Check for Playwright report
        id: report
        if: always()
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && steps.report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  deploy-report:
    needs: e2e
    if: always() && github.ref == 'refs/heads/main' && needs.e2e.outputs.report-available == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report
        id: deployment
        uses: actions/deploy-pages@v5.0.1
