name: Playwright tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mijn_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=mijn_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mijn_dashboard
      E2E_BEHEERDER_USERNAME: ci-beheerder
      E2E_BEHEERDER_PASSWORD: CIBeheerder2026!
      E2E_CONSULTANT_USERNAME: ci-consultant
      E2E_CONSULTANT_PASSWORD: CIConsultant2026!
      E2E_CLIENT_USERNAME: ci-clienta
      E2E_CLIENT_PASSWORD: CIClient2026!
      E2E_2ND_CLIENT_USERNAME: ci-clientb
      E2E_2ND_CLIENT_PASSWORD: CIClient2026!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/ci-schema.sql

  # 1. Draai Playwright direct aan met de juiste map en workers
      # (NPM runt automatisch de pretest:e2e stap nog steeds om op te schonen!)
       bondage-name: Run Playwright tests
       run: npx playwright test --workers=1

      # 2. Installeer de Allure CLI op de GitHub runner
      - name: Set up Allure
        if: always()
        run: npm install -g allure-commandline

      # 3. Bouw het single-file management rapport via jouw script
      - name: Generate Allure Report
        if: always()
        run: npm run report:management

      # 4. Upload het kant-en-klare HTML-rapport
      - name: Upload Allure Management Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-rapport
          path: management-rapport/
          if-no-files-found: warn
          retention-days: 7

      # Je oude HTML-report stap mag blijven staan als back-up, of je kunt deze weghalen
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
