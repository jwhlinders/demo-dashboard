name: Playwright tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Draait elke dag om 02:00 UTC (03:00 Nederlandse tijd in de winter)
    - cron: '0 2 * * *'
    
jobs:
# 1. Jouw bestaande E2E job (draait alleen bij Pull Requests of handmatig)
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mijn_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=mijn_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mijn_dashboard
      E2E_BEHEERDER_USERNAME: ci-beheerder
      E2E_BEHEERDER_PASSWORD: CIBeheerder2026!
      E2E_CONSULTANT_USERNAME: ci-consultant
      E2E_CONSULTANT_PASSWORD: CIConsultant2026!
      E2E_CLIENT_USERNAME: ci-clienta
      E2E_CLIENT_PASSWORD: CIClient2026!
      E2E_2ND_CLIENT_USERNAME: ci-clientb
      E2E_2ND_CLIENT_PASSWORD: CIClient2026!
      ADMIN_INITIAL_PASSWORD: Admin01!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/ci-schema.sql

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test --workers=1

      - name: Set up Allure
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: npm run report:management

      - name: Upload Allure Management Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-rapport
          path: management-rapport/
          if-no-files-found: warn
          retention-days: 7

 # 2. Nieuwe job: Deploy naar Render & Smoke Test (draait alleen na merge naar main)
  deploy-and-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      E2E_SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      E2E_SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      E2E_SMOKE_CLIENT_USERNAME: ${{ secrets.SMOKE_CLIENT_USERNAME }}
      E2E_SMOKE_CLIENT_PASSWORD: ${{ secrets.SMOKE_CLIENT_PASSWORD }}
      PLAYWRIGHT_SMOKE_BASE_URL: http://demo-clientagenda.onrender.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Render & Wait
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
      # Vervang de namen links door de exacte namen uit jouw .env bestand

        run: npm run test:smoke

      - name: Set up Allure
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Smoke Report
        if: always()
        run: npm run report:management

      - name: Upload Allure Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-management-rapport
          path: management-rapport/
          if-no-files-found: warn
          retention-days: 7

