<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Nieuw wachtwoord aanvragen | Cliëntenagenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="request-title">
      <a class="brand login-brand" href="/login" aria-label="Cliëntenagenda">
        <span class="brand-mark" aria-hidden="true">&#128197;</span>
        <span>Cliëntenagenda</span>
      </a>
      <p class="eyebrow">Account herstellen</p>
      <h1 id="request-title">Nieuw wachtwoord aanvragen</h1>
      <p class="login-copy">Vul je gebruikersnaam in. De beheerder neemt contact met je op om je aanvraag af te handelen. Bewaar de statuscode om de voortgang te bekijken.</p>
      <form id="reset-request-form">
        <label class="field" for="request-username">
          <span>Gebruikersnaam</span>
          <input id="request-username" name="username" type="text" maxlength="80" autocomplete="username" required autofocus>
        </label>
        <p class="login-error" id="request-error" role="alert" hidden></p>
        <p class="login-copy" id="request-info" role="status" hidden></p>
        <p class="register-success" id="request-success" role="status" hidden></p>
        <label class="field" id="tracking-code-field" for="tracking-code" hidden>
          <span>Statuscode</span>
          <input id="tracking-code" type="text" readonly aria-readonly="true">
        </label>
        <p class="login-copy" id="track-request-link" hidden><a href="/password-reset-status">Aanvraagstatus bekijken</a></p>
        <button class="primary-button" type="submit">Aanvraag versturen</button>
      </form>
      <p class="login-copy register-prompt"><a href="/login">Terug naar inloggen</a></p>
    </section>
  </main>
  <script>
    const usernameInput = document.querySelector("#request-username");
    const previousUsername = sessionStorage.getItem("passwordResetUsername");
    if (previousUsername) {
      usernameInput.value = previousUsername;
      usernameInput.readOnly = true;
      usernameInput.setAttribute("aria-readonly", "true");
      sessionStorage.removeItem("passwordResetUsername");
    }

    document.querySelector("#reset-request-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.querySelector("#request-error");
      const info = document.querySelector("#request-info");
      const success = document.querySelector("#request-success");
      const trackingCodeField = document.querySelector("#tracking-code-field");
      const trackingCodeInput = document.querySelector("#tracking-code");
      const trackRequestLink = document.querySelector("#track-request-link");
      const username = usernameInput.value.trim();
      error.hidden = true;
      info.hidden = true;
      success.hidden = true;
      trackingCodeField.hidden = true;
      trackRequestLink.hidden = true;
      try {
        const response = await fetch("/api/password-reset-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Aanvraag versturen is mislukt.");
        if (result.alreadySubmitted) {
          info.textContent = result.message;
          info.hidden = false;
          return;
        }
        sessionStorage.removeItem("passwordResetUsername");
        document.querySelector("#reset-request-form button[type='submit']").hidden = true;
        success.textContent = "De aanvraag is ingediend. De beheerder neemt contact met je op. Bewaar de statuscode i.v.m. vervolginstructies";
        success.hidden = false;
        trackingCodeInput.value = result.trackingCode;
        trackingCodeField.hidden = false;
        trackRequestLink.hidden = false;
      } catch (submitError) {
        error.textContent = submitError.message || "Aanvraag versturen is mislukt. Controleer je verbinding.";
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
